<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>无畏契约 · 国服段位</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 8px;
    }
    .rank-card {
      --tier-rgb: 139, 147, 167;
      --result-rgb: 139, 147, 167;
      --tier: rgb(var(--tier-rgb));
      --breath-duration: 2.4s;
      position: relative;
      width: 404px;
      height: 104px;
      display: grid;
      grid-template-columns: 98px 1fr;
      grid-template-rows: 58px 46px;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(var(--tier-rgb), .38);
      border-left: 3px solid var(--tier);
      background:
        linear-gradient(112deg, rgba(var(--tier-rgb), .38) 0%, rgba(var(--tier-rgb), .12) 38%, rgba(13,15,23,.97) 60%, rgba(var(--result-rgb), .32) 100%),
        linear-gradient(135deg, #11131c, #1a1620);
      box-shadow: 0 10px 24px rgba(0,0,0,.50), 0 0 22px -12px rgba(var(--tier-rgb), .85), inset 0 1px 0 rgba(255,255,255,.08);
      color: #f5f6fa;
    }
    .rank-badge {
      grid-row: 1 / 3;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      border-right: 1px solid rgba(255,255,255,.07);
    }
    .rank-badge::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(var(--tier-rgb), .30) 0%, rgba(var(--tier-rgb), .06) 46%, rgba(var(--result-rgb), .26) 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 26%, #000 74%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 26%, #000 74%, transparent 100%);
      pointer-events: none;
    }
    #rank-icon {
      position: relative;
      z-index: 2;
      width: 74px;
      height: 74px;
      object-fit: contain;
      filter: drop-shadow(0 5px 9px rgba(0,0,0,.6));
    }
    #rank-placeholder {
      position: relative;
      z-index: 2;
      width: 44px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255,255,255,.18);
    }
    .rank-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px 0 12px;
    }
    #rank-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .5px;
    }
    #rr-value {
      flex: none;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(var(--tier-rgb), .45);
      background: rgba(var(--tier-rgb), .16);
      color: rgb(var(--tier-rgb));
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .rank-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }
    .stale-indicator {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
    }
    .rank-card.stale .stale-indicator {
      background: #ffd45a;
      box-shadow: 0 0 8px rgba(255,212,90,.95);
    }
    .streak-badge {
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.2;
      white-space: nowrap;
      animation: streakPulse var(--breath-duration, 2.4s) ease-in-out infinite;
    }
    .streak-badge.win {
      color: #e2ffec;
      background: linear-gradient(135deg, rgba(82,217,139,.42), rgba(255,224,138,.20));
      border: 1px solid rgba(82,217,139,.62);
      box-shadow: 0 0 14px -3px rgba(82,217,139,.8);
    }
    .streak-badge.loss {
      color: #ffe4e7;
      background: linear-gradient(135deg, rgba(255,95,109,.46), rgba(255,150,120,.18));
      border: 1px solid rgba(255,95,109,.65);
      box-shadow: 0 0 14px -3px rgba(255,95,109,.8);
    }
    @keyframes streakPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.06); filter: brightness(1.22); }
    }
    .rank-card[data-streak="win"] {
      border-color: rgba(82,217,139,.55);
      border-left-color: var(--tier);
      animation: streakWin var(--breath-duration, 2.4s) ease-in-out infinite;
    }
    .rank-card[data-streak="loss"] {
      border-color: rgba(255,95,109,.55);
      border-left-color: var(--tier);
      animation: streakLoss var(--breath-duration, 2.4s) ease-in-out infinite;
    }
    @keyframes streakWin {
      0%, 100% { box-shadow: 0 10px 24px rgba(0,0,0,.50), 0 0 0 1px rgba(82,217,139,.30), 0 0 22px -10px rgba(82,217,139,.8); filter: brightness(1); }
      50% { box-shadow: 0 10px 24px rgba(0,0,0,.50), 0 0 0 2px rgba(82,217,139,.55), 0 0 34px -6px rgba(82,217,139,1); filter: brightness(1.08); }
    }
    @keyframes streakLoss {
      0%, 100% { box-shadow: 0 10px 24px rgba(0,0,0,.50), 0 0 0 1px rgba(255,95,109,.30), 0 0 22px -10px rgba(255,95,109,.8); filter: brightness(1); }
      50% { box-shadow: 0 10px 24px rgba(0,0,0,.50), 0 0 0 2px rgba(255,95,109,.55), 0 0 34px -6px rgba(255,95,109,1); filter: brightness(1.08); }
    }
    .rank-sub {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 12px;
      border-top: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.035);
      font-size: 13px;
      font-weight: 700;
    }
    #today-record {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cfd4e2;
    }
    #last-change {
      flex: none;
      min-width: 110px;
      padding: 4px 9px;
      border-radius: 7px;
      text-align: center;
      white-space: nowrap;
      color: rgb(var(--result-rgb));
      background: rgba(var(--result-rgb), .14);
      border: 1px solid rgba(var(--result-rgb), .30);
    }
    .partial::after { content: "+"; opacity: .8; }
    .rank-card[data-tier="iron"] { --tier-rgb: 154, 163, 178; }
    .rank-card[data-tier="bronze"] { --tier-rgb: 201, 139, 94; }
    .rank-card[data-tier="silver"] { --tier-rgb: 199, 208, 221; }
    .rank-card[data-tier="gold"] { --tier-rgb: 231, 197, 106; }
    .rank-card[data-tier="platinum"] { --tier-rgb: 111, 214, 200; }
    .rank-card[data-tier="diamond"] { --tier-rgb: 143, 184, 255; }
    .rank-card[data-tier="ascendant"] { --tier-rgb: 127, 224, 138; }
    .rank-card[data-tier="immortal"] { --tier-rgb: 255, 122, 150; }
    .rank-card[data-tier="radiant"] { --tier-rgb: 255, 224, 138; }
    .rank-card[data-tier="unranked"] { --tier-rgb: 139, 147, 167; }
    .rank-card[data-result="win"] { --result-rgb: 82, 217, 139; }
    .rank-card[data-result="loss"] { --result-rgb: 255, 95, 109; }
    .rank-card[data-result="draw"] { --result-rgb: 231, 197, 106; }
    .rank-card[data-result="unknown"] { --result-rgb: 139, 147, 167; }
  </style>
</head>
<body>
  <div class="rank-card" id="rank-card" data-tier="unranked" data-result="unknown">
    <div class="rank-badge" aria-hidden="true">
      <img id="rank-icon" alt="" referrerpolicy="no-referrer" hidden>
      <span id="rank-placeholder"></span>
    </div>
    <div class="rank-main">
      <span id="rank-name">--</span>
      <span id="rr-value">--</span>
      <span class="rank-status">
        <span id="streak-badge" class="streak-badge" hidden></span>
        <span class="stale-indicator" title="数据暂时未更新"></span>
      </span>
    </div>
    <div class="rank-sub">
      <span id="today-record">今日 0 胜 / 0 负</span>
      <span id="last-change">上一局 --</span>
    </div>
  </div>

  <script>
    const card = document.getElementById('rank-card');
    const icon = document.getElementById('rank-icon');
    const placeholder = document.getElementById('rank-placeholder');
    const rankName = document.getElementById('rank-name');
    const rrValue = document.getElementById('rr-value');
    const todayRecord = document.getElementById('today-record');
    const lastChange = document.getElementById('last-change');
    const streakBadge = document.getElementById('streak-badge');
    const indicator = document.querySelector('.stale-indicator');

    function safeText(value, fallbackValue = '--') {
      return value === null || value === undefined || value === '' ? fallbackValue : String(value);
    }

    function tierOf(rank) {
      const text = String(rank || '');
      if (text.includes('辐能') || text.includes('无畏')) return 'radiant';
      if (text.includes('神话')) return 'immortal';
      if (text.includes('超凡')) return 'ascendant';
      if (text.includes('钻石')) return 'diamond';
      if (text.includes('铂金')) return 'platinum';
      if (text.includes('黄金')) return 'gold';
      if (text.includes('白银')) return 'silver';
      if (text.includes('青铜')) return 'bronze';
      if (text.includes('黑铁')) return 'iron';
      return 'unranked';
    }

    function resultOf(value, change) {
      const text = String(value || '');
      if (text.includes('胜')) return 'win';
      if (text.includes('负') || text.includes('败')) return 'loss';
      if (text.includes('平')) return 'draw';
      if (change && change !== '--') {
        if (change.startsWith('+')) return 'win';
        if (change.startsWith('-')) return 'loss';
        if (change === '0') return 'draw';
      }
      return 'unknown';
    }

    let requestedIconURL = '';
    let failedIconURL = '';
    let lastIconRank = '';
    let lastIconURL = '';

    icon.onerror = () => {
      failedIconURL = requestedIconURL;
      icon.hidden = true;
      placeholder.hidden = false;
    };

    function showIcon(url) {
      icon.hidden = false;
      placeholder.hidden = true;
      if (requestedIconURL !== url) {
        requestedIconURL = url;
        icon.src = url;
      }
    }

    function applyState(data) {
      const rank = safeText(data.rank);
      rankName.textContent = rank;

      const rr = safeText(data.rr);
      rrValue.textContent = rr === '--' ? '--' : `${rr} 分`;

      todayRecord.textContent = `今日 ${Number(data.today_wins || 0)} 胜 / ${Number(data.today_losses || 0)} 负`;
      todayRecord.classList.toggle('partial', Boolean(data.today_partial));
      card.classList.toggle('stale', Boolean(data.stale || data.warning));
      const change = safeText(data.last_rr_change);
      card.dataset.tier = tierOf(rank);
      card.dataset.result = resultOf(data.last_result, change);
      const streakType = String(data.streak_type || 'none');
      const streakCount = Number(data.streak_count || 0);
      const showStreak = streakCount >= 2 && (streakType === 'win' || streakType === 'loss');
      card.dataset.streak = showStreak ? streakType : 'none';
      if (showStreak) {
        streakBadge.hidden = false;
        streakBadge.className = `streak-badge ${streakType}`;
        streakBadge.textContent = `${streakCount} ${streakType === 'win' ? '连胜' : '连败'}`;
      } else {
        streakBadge.hidden = true;
        streakBadge.className = 'streak-badge';
        streakBadge.textContent = '';
      }
      indicator.title = data.error || data.warning || '数据已更新';

      let iconURL = data.rank_icon || '';
      if (!iconURL && lastIconRank === rank && lastIconURL && lastIconURL !== failedIconURL) {
        iconURL = lastIconURL;
      }
      if (iconURL && iconURL !== failedIconURL) {
        lastIconRank = rank;
        lastIconURL = iconURL;
        showIcon(iconURL);
      } else {
        icon.hidden = true;
        placeholder.hidden = false;
        if (!iconURL) {
          requestedIconURL = '';
          failedIconURL = '';
          icon.removeAttribute('src');
        }
      }

      lastChange.textContent = `上一局 ${change === '--' ? '--' : `${change} 分`}`;
    }

    async function refresh() {
      try {
        const response = await fetch('/api/state', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        applyState(await response.json());
      } catch (_) {
        card.classList.add('stale');
        indicator.title = '本机状态读取失败，保留上次显示';
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
